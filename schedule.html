  <main>
    <section class="section" style="padding-top:var(--space-5);">
      <div class="container">
        <div class="page-hero" style="padding-block:0 32px;text-align:left;">
          <span class="eyebrow">周日历 · 课程表</span>
          <h1>完整课程表</h1>
          <p style="margin-inline:0;">点空白格子添加课程，点课程块编辑或删除；数据仅保存在本地浏览器。</p>
          <span class="sched-badge" id="sched-badge" style="margin-top:12px;">加载中…</span>
        </div>

        <!-- 学期信息编辑 -->
        <div class="form-panel sched-meta">
          <div class="field">
            <label for="meta-grade">年级</label>
            <input class="input" id="meta-grade" type="text" placeholder="如：大三" />
          </div>
          <div class="field">
            <label for="meta-term">学期</label>
            <input class="input" id="meta-term" type="number" min="1" max="8" />
          </div>
          <div class="field">
            <label for="meta-week">当前周次</label>
            <input class="input" id="meta-week" type="number" min="1" max="30" />
          </div>
          <button class="btn btn-primary" id="meta-save" type="button">保存</button>
          <button class="btn btn-ghost" id="excel-import" type="button">导入 Excel</button>
          <input type="file" id="excel-file" accept=".xls,.xlsx" hidden />
        </div>

        <!-- 大课程表（data-glow 让表格获得与卡片一致的光照） -->
        <div class="sched-table" data-glow>
          <div class="sched-grid" id="sched-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 添加/编辑课程弹层 -->
  <div class="sched-modal" id="sched-modal" hidden>
    <div class="sched-modal-card">
      <h3 id="sched-modal-title" class="h2" style="font-size:1.25rem;">添加课程</h3>
      <div class="sched-form">
        <label>课程名
          <input class="input" id="f-name" type="text" placeholder="课程名称" />
        </label>
        <div class="sched-form-row">
          <label>星期
            <select id="f-day">
              <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
              <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
            </select>
          </label>
          <label>开始节次
            <select id="f-start">
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
              <option>13</option><option>14</option><option>15</option><option>16</option>
            </select>
          </label>
          <label>节数
            <select id="f-len">
              <option value="1">1节</option><option value="2" selected>2节</option><option value="3">3节</option><option value="4">4节</option>
            </select>
          </label>
          <label>周次
            <select id="f-weeks">
              <option value="all">每周</option>
              <option value="odd">单周</option>
              <option value="even">双周</option>
            </select>
          </label>
        </div>
        <div class="sched-form-colors">
          <span class="sched-form-label">卡片颜色</span>
          <div class="sched-color-row" id="f-colors">
            <button type="button" class="sched-color sw-auto is-active" data-color="auto" title="跟随自动分配的颜色">自动</button>
            <button type="button" class="sched-color" data-color="#0080FF" style="background:#0080FF" title="#0080FF"></button>
            <button type="button" class="sched-color" data-color="#8B00FF" style="background:#8B00FF" title="#8B00FF"></button>
            <button type="button" class="sched-color" data-color="#FF1493" style="background:#FF1493" title="#FF1493"></button>
            <button type="button" class="sched-color" data-color="#20B2AA" style="background:#20B2AA" title="#20B2AA"></button>
            <button type="button" class="sched-color" data-color="#FF8A00" style="background:#FF8A00" title="#FF8A00"></button>
            <button type="button" class="sched-color" data-color="#00A86B" style="background:#00A86B" title="#00A86B"></button>
            <button type="button" class="sched-color" data-color="#5A6BFF" style="background:#5A6BFF" title="#5A6BFF"></button>
          </div>
        </div>
        <label>地点
          <input class="input" id="f-room" type="text" placeholder="如：教3-101" />
        </label>
        <label>教师
          <input class="input" id="f-teacher" type="text" placeholder="选填" />
        </label>
      </div>
      <div class="sched-modal-actions">
        <button class="btn btn-ghost" id="f-delete" type="button" style="display:none;margin-right:auto;">删除</button>
        <button class="btn btn-ghost" id="f-cancel" type="button">取消</button>
        <button class="btn btn-primary" id="f-save" type="button">保存</button>
      </div>
    </div>
